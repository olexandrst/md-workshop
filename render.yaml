# Render Blueprint — автоматичне розгортання: Dashboard → New → Blueprint → оберіть цей репозиторій.
# Створює веб-сервіс (Python, gunicorn) і керовану базу PostgreSQL у Франкфурті (найближчий регіон до України).
# Під час створення Render попросить ввести ADMIN_PASSWORD — пароль ведучого.
services:
  - type: web
    name: md-workshop
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Таблиці та стартові дані створюються автоматично при старті (gunicorn.conf.py → on_starting).
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: md-workshop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "8"

databases:
  - name: md-workshop-db
    plan: basic-256mb
    region: frankfurt
    databaseName: workshop
    user: workshop
    ipAllowList: [] # лише внутрішні підключення з сервісів Render
