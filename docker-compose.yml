# Локальний запуск з Postgres:  docker compose up --build
# Екран ведучого: http://localhost:8000/admin
# Щоб телефони в залі відкрили сторінку за QR-кодом, задайте у файлі .env
#   PUBLIC_URL=http://<IP-вашого-ПК-у-Wi-Fi>:8000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://workshop:workshop@db:5432/workshop
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "8000:8000"

volumes:
  pgdata:
